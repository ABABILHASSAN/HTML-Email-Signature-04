<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Email Signature 4 - Unique Border</title>
</head>
<body style="margin:0; padding:0; background-color:#e0e0e0; height:100vh; display:flex; align-items:center; justify-content:center; font-family:Arial, sans-serif;">

  <!-- Signature Container -->
  <table cellpadding="0" cellspacing="0" role="presentation" style="border:3px solid #ff8c42; border-radius:15px; padding:25px; text-align:center; color:#222; background-color:#ffffff; box-shadow:0 5px 15px rgba(0,0,0,0.2); max-width:420px;">
    
    <!-- Profile Image -->
    <tr>
      <td style="padding-bottom:12px;">
        <img src="profile-image.png" width="90" height="90" style="border-radius:50%; border:3px solid #ff8c42;" alt="Ababil Hassan">
      </td>
    </tr>
    
    <!-- Name & Title -->
    <tr>
      <td style="font-size:20px; font-weight:bold; color:#111;">Ababil Hassan</td>
    </tr>
    <tr>
      <td style="font-size:13px; color:#555; padding-bottom:8px;">Front-End Developer | Email Designer</td>
    </tr>
    
    <!-- Tagline -->
    <tr>
      <td style="font-size:12px; font-style:italic; color:#777; padding-bottom:12px;">
        "Designing clean, responsive experiences"
      </td>
    </tr>
    
    <!-- Contact Info with new icons -->
    <tr>
      <td style="font-size:13px; padding-bottom:4px;">📞 <a href="tel:+8801234567890" style="color:#ff8c42; text-decoration:none;">+880 1234-567890</a></td>
    </tr>
    <tr>
      <td style="font-size:13px; padding-bottom:4px;">✉️ <a href="mailto:ababil@email.com" style="color:#ff8c42; text-decoration:none;">ababil@email.com</a></td>
    </tr>
    <tr>
      <td style="font-size:13px; padding-bottom:4px;">📍 <span style="color:#555;">Dhaka, Bangladesh</span></td>
    </tr>
    <tr>
      <td style="font-size:13px; padding-bottom:10px;">🌐 <a href="https://ababilhassan.dev" style="color:#ff8c42; text-decoration:none;">ababilhassan.dev</a></td>
    </tr>
    
    <!-- Social Icons -->
    <tr>
      <td style="padding-top:8px;">
        <a href="https://linkedin.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/174/174857.png" width="20" height="20" alt="LinkedIn"></a>
        <a href="https://github.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733553.png" width="20" height="20" alt="GitHub"></a>
        <a href="https://twitter.com" style="margin:0 6px;"><img src="https://cdn-icons-png.flaticon.com/24/733/733579.png" width="20" height="20" alt="Twitter"></a>
      </td>
    </tr>

  </table>

</body>
</html>
